<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ config.site_name }} - Portfolio Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <style>
    :root{
      --bg:#ffffff;
      --ink:#0d0d0d;
      --muted:#6b7280; /* slate-500 */
      --accent:#5AA7FF;
      --grid-gap:42px;
      --maxw:1080px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      line-height:1.45;
    }
    a{color:inherit;text-decoration:none}

    /* --- Topbar --- */
    .topbar{
      position:sticky;top:0;z-index:10;
      background:rgba(255,255,255,.85);
      backdrop-filter:saturate(140%) blur(8px);
      border-bottom:1px solid #eaeaea;
    }
    .nav{
      max-width:var(--maxw);
      margin:0 auto;
      padding:18px 24px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .brand{letter-spacing:.35em;font-weight:600}
    .menu{display:flex;gap:26px;align-items:center;font-size:14px;color:var(--muted)}
    .menu a{position:relative}
    .menu a.active{color:var(--ink);font-weight:600}
    .menu a.active::after{
      content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%) rotate(45deg);
      width:6px;height:6px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);
    }

    /* --- Layout --- */
    .wrap{max-width:var(--maxw);margin:40px auto;padding:0 24px 64px}

    .grid{
      display:grid;gap:var(--grid-gap);
      grid-template-columns:repeat(12,1fr);
    }

    /* Six-up responsive gallery */
    .card{grid-column:span 4; display:flex; flex-direction:column; align-items:center; text-align:center;}
    @media (max-width: 980px){.card{grid-column:span 6}}
    @media (max-width: 640px){.card{grid-column:span 12}}

    .thumb{
      aspect-ratio: 1 / 1; /* perfect square */
      width:100%;
      border-radius:8px;
      overflow:hidden;
      position:relative;
      box-shadow:0 10px 25px rgba(0,0,0,.06);
      background:#f3f4f6;
    }
    .thumb img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);transition:transform .45s ease, filter .45s ease}
    .thumb::after{ /* subtle inner border */
      content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none
    }

    .card:hover .thumb img{transform:scale(1.06);filter:saturate(1.05)}

    .label{
      margin-top:14px;
      letter-spacing:.45em;
      color:var(--muted);
      font-size:13px;
      text-transform:uppercase;
      text-align:center;
      width:100%;
    }

    footer{max-width:var(--maxw);margin:40px auto 56px;padding:0 24px;color:#9aa1ad;font-size:13px;text-align:center;}
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
</head>
<body>
  <!-- Top Navigation -->
  <header class="topbar" role="banner">
    <nav class="nav" aria-label="Primary">
      <div class="brand" aria-label="Site title">
        <a href="/"><span class="editable" data-field="site_name">{{ config.site_name }}</span></a>
      </div>
      <div class="menu" role="menubar">
        {% for item in config.navigation %}
        <a href="{{ item.url }}" class="nav-item" data-index="{{ loop.index0 }}" role="menuitem">{{ item.label }}</a>
        <button class="edit-btn nav-edit-btn" data-index="{{ loop.index0 }}">&#9998;</button>
        <button class="delete-btn nav-delete-btn" data-index="{{ loop.index0 }}">&times;</button>
        {% endfor %}
        <button class="add-nav-btn" id="addNavBtn">+</button>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>&copy; <span id="y"></span> <span class="editable" data-field="footer_copyright">{{ config.footer.copyright }}</span></footer>

  <!-- Editor toolbar -->
  <div class="editor-toolbar" id="editorToolbar">
    <button class="deploy-btn" id="deployBtn">Deploy to Website</button>
    <button class="settings-btn" id="settingsBtn">&#9881;</button>
  </div>

  <!-- Modal and toast containers -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  <script src="{{ url_for('static', filename='editor.js') }}"></script>
  <script src="{{ url_for('static', filename='deploy.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
