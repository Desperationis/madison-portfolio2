<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ config.site_name }} - Portfolio Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  {% block page_styles %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
</head>
<body>
  <!-- Top Navigation -->
  <header class="topbar" role="banner">
    <nav class="nav" aria-label="Primary">
      <div class="brand" aria-label="Site title">
        <a href="/">{{ config.site_name }}</a>
      </div>
      <div class="menu" role="menubar">
        {% for item in config.navigation %}
        <span class="nav-group">
          <a href="{{ item.url }}" class="nav-item" data-index="{{ loop.index0 }}" role="menuitem">{{ item.label }}</a>
          <button class="nav-edit-btn" data-index="{{ loop.index0 }}">&#9998;</button>
          <button class="nav-delete-btn" data-index="{{ loop.index0 }}">&times;</button>
        </span>
        {% endfor %}
        <button class="add-nav-btn" id="addNavBtn">+</button>
      </div>
    </nav>
  </header>

  {% block content %}{% endblock %}

  <footer>&copy; <span id="y"></span> <span class="editable" data-field="footer_copyright">{{ config.footer.copyright }}</span></footer>

  <!-- Editor toolbar -->
  <div class="editor-toolbar" id="editorToolbar">
    <button class="deploy-btn" id="deployBtn">Deploy to Website</button>
    <button class="settings-btn" id="settingsBtn">&#9881;</button>
  </div>

  <!-- Modal and toast containers -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  <script src="{{ url_for('static', filename='editor.js') }}"></script>
  <script src="{{ url_for('static', filename='deploy.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
